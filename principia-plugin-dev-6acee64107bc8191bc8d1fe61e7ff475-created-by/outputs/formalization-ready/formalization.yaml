version: "v0.4"

project:
  name: "The Arbitrage of Convex Bonds Under Yield Shifts"
  description: "An investor holds two bonds with different maturities that perfectly match the present value and duration of a fixed future liability at a baseline interest rate. The problem requires proving that any non-zero shift in interest rates will cause the bond portfolio's value to strictly exceed the liability's value, guaranteeing a risk-free profit due to the portfolio's superior structural convexity."
  authors:
    - "levdymkin"
  license: "Apache-2.0"
  responsible_maintainers:
    - "levdymkin"

