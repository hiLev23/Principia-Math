name: Principia Comparator

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparator:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Lean without prebuilding the solution
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Compare the solution with the trusted challenge
        run: lake comparator --paranoid

